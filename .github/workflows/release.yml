name: Release
on:
  push:
    tags: ['release/*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate source version
        id: version
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          version=${SOURCE_TAG#release/}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(sed -n 's/^version=//p' build.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check publication recovery and failure handling
        run: scripts/tests/publish-tests.sh
      - name: Vet for linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: go vet ./...
      - name: Test, check runc and CNI SHA-256, build image and Swift package
        run: ./build.sh
      - name: Check Swift package and collect release files
        run: |
          scripts/tests/package-tests.sh
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          cp stage/cs-project-image.tar.gz "$release/"
          (cd "$release" && sha256sum cs-project-image.tar.gz > cs-project-image.tar.gz.sha256)
          cp -R stage/swift "$release/package"
          cp LICENSE README.md "$release/package/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-input
          path: ${{ runner.temp }}/release
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-input
          path: ${{ runner.temp }}/release
      - name: Check that the package has the released archive
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum -c cs-project-image.tar.gz.sha256
          cmp cs-project-image.tar.gz package/Sources/CCSProjectImage/cs-project-image.tar.gz
          grep -q "return \"$(cut -d ' ' -f1 cs-project-image.tar.gz.sha256)\";" package/Sources/CCSProjectImage/embedded_image.c
      - name: Publish signed package commit and version tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/publish-swift-package.sh "$VERSION" "$RUNNER_TEMP/release/package" "$GITHUB_SHA"
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: cs-project v${{ needs.build.outputs.version }}
          files: |
            ${{ runner.temp }}/release/cs-project-image.tar.gz
            ${{ runner.temp }}/release/cs-project-image.tar.gz.sha256
          fail_on_unmatched_files: true
          body: |
            Launcher image of the Compose project VM (OCI archive, linux/arm64) and Swift package.

            `.package(url: "https://github.com/beshkenadze/cs-project.git", exact: "${{ needs.build.outputs.version }}")`

            Product: `CSProjectImage`. API: `CSProjectImage.archiveData: Data`, `CSProjectImage.sha256: String`, `CSProjectImage.reference: String`.
